; ─────────────────────────────────────────────────────────────────────────────
; OPcache + JIT PROD — /etc/php/8.4/fpm/conf.d/99-opcache-prod.ini
;
; validate_timestamps=0: không stat file mỗi request — nhanh nhất.
; ĐÁNH ĐỔI: mỗi lần deploy code PHẢI `systemctl reload php8.4-fpm`
; (đưa vào script deploy, sau config:cache/route:cache).
; ─────────────────────────────────────────────────────────────────────────────
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 32
opcache.max_accelerated_files = 30000
opcache.enable_file_override = 1

; JIT tracing — lợi nhất cho code nóng (DTO mapping, serialize JSON...)
opcache.jit = tracing
opcache.jit_buffer_size = 128M

; realpath cache — đỡ syscall stat với autoload vendor lớn
realpath_cache_size = 4096k
realpath_cache_ttl = 600
