; ─────────────────────────────────────────────────────────────────────────────
; php-fpm pool PROD — /etc/php/8.4/fpm/pool.d/www.conf (thay file mặc định)
; Sau khi sửa: systemctl reload php8.4-fpm
;
; CÔNG THỨC pm.max_children:
;   max_children = RAM dành cho FPM ÷ RSS 1 worker
;   Đo RSS thật:  ps -ylC php-fpm8.4 --sort:rss   (cột RSS, đơn vị KB)
;   Laravel app này ~60-90MB/worker → ví dụ server 8GB (dành 5GB cho FPM):
;   5120MB ÷ 85MB ≈ 60 children.
;
;   TỔNG concurrency = số app server × max_children.
;   Với 30k active (in-flight thực vài nghìn do think-time):
;   ví dụ 4 server × 60 = 240 request PHP đồng thời + listen backlog
;   là đủ khi p95 response < 200ms (240 ÷ 0.2s = 1200 req/s bền vững).
;   Nghẽn thật thường nằm ở DB/lock trước khi hết worker.
; ─────────────────────────────────────────────────────────────────────────────
[www]
user = www-data
group = www-data

listen = /run/php/php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
; Hàng đợi kernel khi mọi worker bận — vượt quá thì từ chối connection.
listen.backlog = 1024

; static: prod tải đều — worker luôn sẵn, không tốn chi phí fork lúc burst.
pm = static
pm.max_children = 60          ; SỬA theo công thức trên

; Recycle chống memory leak tích luỹ
pm.max_requests = 1000

; Theo dõi worker busy/idle (map trong nginx, chặn IP ngoài):
;   location = /fpm-status { allow 127.0.0.1; deny all;
;     fastcgi_pass unix:/run/php/php8.4-fpm.sock; include fastcgi_params; }
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Kill request kẹt >60s (đếm cả I/O, khác max_execution_time)
request_terminate_timeout = 60s

; Log request chậm >2s kèm stacktrace
slowlog = /var/log/php/www-slow.log
request_slowlog_timeout = 2s

catch_workers_output = yes
php_admin_value[error_log] = /var/log/php/www-error.log
php_admin_flag[log_errors] = on
