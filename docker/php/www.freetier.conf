; ─────────────────────────────────────────────────────────────────────────────
; php-fpm pool tuning — FREE TIER POC (EC2 t3.micro, 1 vCPU / 1GB RAM TỔNG,
; chia sẻ với nginx + redis×2 + meilisearch + queue + scheduler trên CÙNG máy).
;
; www.pool.conf (staging) đặt pm.max_children=60 — với RSS ~60-90MB/worker
; (theo đúng công thức ghi trong file đó) thì 60 worker = 3.6-5.4GB, tự nó đã
; gấp 3-5 lần TOÀN BỘ RAM máy này. Không phải giảm nhẹ, phải viết file RIÊNG.
;
; Ngân sách ước tính cho FPM trên free tier: ~250-300MB (phần còn lại sau OS
; + nginx + 2 Redis + Meilisearch + queue + scheduler cùng chia 1GB) → RSS
; ~60-70MB/worker (dev nhỏ, ít module hơn production thật) → max_children=4
; là mức an toàn, không phải mức tối ưu tốc độ — POC vài chục request đồng
; thời là đủ, không phải sizing cho tải thật.
; ─────────────────────────────────────────────────────────────────────────────
[www]
; static thay vì dynamic: máy quá nhỏ để chịu nổi chi phí fork lúc burst —
; giữ cố định số worker, khỏi risk pm.max_children bị đội lên giữa lúc tải.
pm = static
pm.max_children = 4

pm.max_requests = 500

pm.status_path = /fpm-status

; Free tier hay chậm hơn hẳn (CPU credit t3.micro cạn thì throttle mạnh) —
; nới hơn www.pool.conf (15s) để không cắt oan request đang chờ CPU credit,
; nhưng vẫn phải có trần để 1 request kẹt không giữ worker vĩnh viễn (bài học
; sự cố zombie query 2026-08-11 — PHẢI luôn có timeout, không phụ thuộc
; MAX_STATEMENT_TIME một mình vì đó là tầng DB, đây là tầng FPM).
request_terminate_timeout = 30s

slowlog = /proc/self/fd/2
request_slowlog_timeout = 3s
