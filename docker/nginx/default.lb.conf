# nginx vhost Laravel infun — phiên bản LOAD BALANCE.
# Khác với default.conf:
#   - upstream pool "fpm_pool" resolve qua DNS Docker mỗi 10s
#   - khi `docker compose up --scale infun-php=N`, Docker DNS trả N IP cho
#     tên `infun-php` → nginx round-robin / least_conn tự balance
#   - log thêm $upstream_addr để biết request đi backend nào
#
# Lưu ý: directive `resolver` BẮT BUỘC. Không có resolver, nginx chỉ
# resolve DNS 1 lần lúc start và cache vĩnh viễn → scale thêm replica
# sẽ không nhận được traffic mới.

# 127.0.0.11 là DNS embedded của Docker (mọi container đều dùng IP này).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fpm_pool {
    # least_conn: ưu tiên backend ít connection nhất. Hợp với request
    # PHP có thời gian xử lý không đều (DB query nặng/nhẹ khác nhau).
    # Đổi sang `random two` hoặc bỏ (default round-robin) để so sánh.
    least_conn;

    # Dùng `server` với `resolve` để nginx re-resolve mỗi 10s — cần
    # nginx-plus HOẶC nginx mainline OSS >= 1.27.3 (đã có set_by_lua
    # workaround không cần). Image nginx:1.27-alpine support sẵn.
    server infun-php:9000 resolve max_fails=3 fail_timeout=10s;

    # keepalive connection để giảm overhead bắt tay TCP với FPM.
    keepalive 32;
}

# Custom log format: thêm upstream + response time để phân tích perf.
log_format lb_combined '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'upstream=$upstream_addr';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /var/log/nginx/infun_access.log lb_combined;
    error_log  /var/log/nginx/infun_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # ===== Điểm khác biệt LB =====
        fastcgi_pass fpm_pool;
        fastcgi_keep_conn on;
        # ==============================

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Healthcheck endpoint cho LB tự test
    location = /__lb_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
