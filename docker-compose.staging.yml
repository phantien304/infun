# ═══════════════════════════════════════════════════════════════════════════
# STAGING HOÀN CHỈNH — image BẤT BIẾN, KHÔNG mount code, DB/Redis/Meili RIÊNG.
#
# Đây là file ĐỘC LẬP (không layer lên docker-compose.yml) để chắc chắn KHÔNG
# kế thừa bind-mount `./:/var/www/html` của bản dev. Chạy bằng đúng 1 -f:
#
#   # 1. Set APP_KEY (lấy từ .env dev hoặc: php artisan key:generate --show)
#   #    PowerShell: $env:STAGING_APP_KEY = "base64:....="
#   #    bash:       export STAGING_APP_KEY="base64:....="
#
#   # 2. Build image (nướng code hiện tại trong folder vào image)
#   docker compose -f docker-compose.staging.yml build
#
#   # 3. Chạy
#   docker compose -f docker-compose.staging.yml up -d
#
#   # (tuỳ chọn) 3 PHP worker sau LB để test tải:
#   docker compose -f docker-compose.staging.yml up -d --scale infun-php=3
#
# ĐẨY CODE MỚI LÊN STAGING = build lại rồi up (xem docs/STAGING.md):
#   docker compose -f docker-compose.staging.yml build \
#     && docker compose -f docker-compose.staging.yml up -d
#
# Truy cập:  http://localhost:8100   (đổi STAGING_WEB_PORT nếu cần)
# ═══════════════════════════════════════════════════════════════════════════

# ── ENV chung cho app / queue / scheduler ──────────────────────────────────
x-app-env: &app-env
  APP_ENV: staging
  APP_DEBUG: "false"
  # BẮT BUỘC: image không có .env nên APP_KEY phải truyền qua env.
  APP_KEY: "${STAGING_APP_KEY:?Chua set STAGING_APP_KEY - xem docs/STAGING.md}"
  # Base URL DUY NHẤT cho toàn app: <base href> + publicUrl() + mail/sitemap/queue
  # đều lấy từ đây (head.blade.php & Common.php đã chuyển sang config('app.url')).
  # Default = cổng web-staging (8100). Truy cập staging bằng host khác (LAN IP,
  # domain riêng) thì BẮT BUỘC set STAGING_APP_URL khớp host đó trước khi up.
  APP_URL: "${STAGING_APP_URL:-http://localhost:8100}"

  # BẮT BUỘC: image không ship .env nên config('app.locale') fallback về default
  # cứng trong config/app.php ('en') nếu thiếu biến này — resources/lang/ CHỈ có
  # 'vi' (không có 'en') nên mọi trans() sẽ ra raw key/rỗng. Dự án dùng vi duy nhất.
  APP_LOCALE: vi
  APP_LOCALES: vi
  APP_FALLBACK_LOCALE: vi

  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_DATABASE: infun
  DB_USERNAME: root
  DB_PASSWORD: root
  # ── Read/write split qua ProxySQL (6033=writer HG10, 6034=reader HG20) ──
  # config/database.php connection `mysql` đã sẵn logic đọc các biến này.
  DB_WRITE_HOST: proxysql
  DB_WRITE_PORT: "6033"
  DB_READ_HOST1: proxysql
  DB_READ_PORT: "6034"

  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  SCOUT_DRIVER: meilisearch
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: ""

  # R2 + Cloudflare CDN (ảnh) — thiếu block này disk `image` fallback driver
  # 'local' (default config/filesystems.php) → resizeImage() build URL local
  # (localhost:8100/storage/...) thay vì CDN. Giá trị lấy từ .env dev, truyền
  # qua biến STAGING_AWS_* trước khi `up` (không hardcode secret vào file này).
  IMAGE_DISK_DRIVER: "${STAGING_IMAGE_DISK_DRIVER:-s3}"
  AWS_ACCESS_KEY_ID: "${STAGING_AWS_ACCESS_KEY_ID:?Chua set STAGING_AWS_ACCESS_KEY_ID - xem .env dev}"
  AWS_SECRET_ACCESS_KEY: "${STAGING_AWS_SECRET_ACCESS_KEY:?Chua set STAGING_AWS_SECRET_ACCESS_KEY - xem .env dev}"
  AWS_DEFAULT_REGION: "${STAGING_AWS_DEFAULT_REGION:-auto}"
  AWS_BUCKET: "${STAGING_AWS_BUCKET:-infun-media}"
  AWS_ENDPOINT: "${STAGING_AWS_ENDPOINT:?Chua set STAGING_AWS_ENDPOINT - xem .env dev}"
  AWS_URL: "${STAGING_AWS_URL:-https://cdn.lartisan.vn}"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  # Throttle nới cho staging (docs/SCALE-30K.md mục D — "BẮT BUỘC trước khi
  # chạy k6: nới/tắt throttle add-to-cart/save-order, không thì chỉ đo 429").
  # Default 100000 (coi như tắt) vì staging = bãi load-test; PROD thật set qua
  # deploy/env.production.example (giữ 30/10). Cần siết lại để test throttle
  # itself thì override STAGING_THROTTLE_* khi `up`.
  THROTTLE_ADD_TO_CART: "${STAGING_THROTTLE_ADD_TO_CART:-100000}"
  THROTTLE_SAVE_ORDER: "${STAGING_THROTTLE_SAVE_ORDER:-100000}"

  # log thay vì smtp khi chạy k6 checkout — mỗi order dispatch 1 job gửi mail,
  # đẩy qua mailpit thật vẫn tốn overhead + dễ chạm MP_MAX_MESSAGES=500. `log`
  # ghi nội dung mail vào log Laravel (stderr, xem LOG_CHANNEL dưới), không gọi
  # SMTP nào cả — nhẹ nhất cho load test. Cần xem mail thật thì override lại
  # STAGING_MAIL_MAILER=smtp khi `up`.
  MAIL_MAILER: "${STAGING_MAIL_MAILER:-log}"
  MAIL_HOST: mailpit
  MAIL_PORT: "1025"
  LOG_CHANNEL: stderr

  # CORS cho infuncms (SPA riêng, gọi /rcms) — config/cors.php mặc định chỉ
  # cho cms.infun.test/cms.infun.co (dev), staging KHÔNG có domain thật nên
  # infuncms-web-staging phải gọi qua Tailscale IP/localhost, phải khai origin
  # đó ở đây thì trình duyệt mới không bị chặn CORS. Default gồm cả Tailscale
  # IP (ai cũng vào được, không cần cùng LAN) và localhost (test ngay trên máy
  # staging) — cổng 8200 khớp STAGING_CMS_WEB_PORT của infuncms.
  CORS_ALLOWED_ORIGINS: "${STAGING_CORS_ALLOWED_ORIGINS:-http://100.99.170.2:8200,http://localhost:8200}"

  # config/theme.php đã ghi rõ "BẬT ở staging để khách bấm thử qua lại giữa
  # các mẫu mà không cần DNS" — nhưng file này thiếu biến nên vẫn rơi về
  # default false của env(). Bật sẵn ở đây, tắt khẩn cấp qua .env không cần
  # sửa file/redeploy.
  THEME_ALLOW_QUERY: "${STAGING_THEME_ALLOW_QUERY:-true}"

services:
  # ── App PHP-FPM (image bất biến, scale được) ─────────────────────────────
  infun-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.staging
      target: app
    image: ghcr.io/phantien304/infun-app:staging
    restart: unless-stopped
    # KHÔNG container_name → cho phép `--scale infun-php=N`
    # Chuẩn 2026-07-23 (xem docs/CHANGELOG-2026-07-23-k6-loadtest-fixes.md):
    # 4 replica mặc định qua deploy.replicas — `up -d` (không kèm --scale)
    # vẫn giữ đúng 4, không tụt về 1 như trước (gotcha cũ ở docs/STAGING.md).
    # `--scale infun-php=N` khi chạy vẫn override được giá trị này.
    deploy:
      replicas: 4
    environment:
      <<: *app-env
    volumes:
      - staging_logs:/var/www/html/storage/logs   # chỉ log, KHÔNG mount code
    depends_on:
      mysql: { condition: service_healthy }
      proxysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    networks: [infun-net]

  # ── Admin PHP-FPM (pool riêng cho /vcms + /rcms — CMS) ────────────────────
  # THIẾU service này thì nginx (docker/nginx/default.lb.conf dòng
  # `server infun-admin-php:9000 resolve ...`) không resolve được hostname →
  # mọi request /rcms/* (kể cả từ infuncms) trả 502 ngay lập tức, KHÔNG phải
  # lỗi CORS dù trình duyệt hiển thị y hệt CORS (response 502 không có header
  # CORS nên browser báo nhầm). Mirror docker-compose.production.yml — 1
  # replica là đủ cho staging (so với 4 của infun-php storefront).
  infun-admin-php:
    image: ghcr.io/phantien304/infun-app:staging
    restart: unless-stopped
    deploy:
      replicas: ${STAGING_ADMIN_PHP_REPLICAS:-1}
    environment:
      <<: *app-env
      # Nạp docker/php/www.admin.conf: worker terminate 300s (thay vì 15s của
      # storefront) — export/import CMS chạy vài phút là bình thường, timeout
      # 15s của pool storefront (xem log "execution timed out (15s)") không
      # đủ cho các thao tác này.
      FPM_POOL_PROFILE: admin
    volumes:
      - staging_logs:/var/www/html/storage/logs
    depends_on:
      mysql: { condition: service_healthy }
      proxysql: { condition: service_healthy }
      redis: { condition: service_healthy }
      meilisearch: { condition: service_healthy }
    networks: [infun-net]

  # ── Queue worker (cùng image) ────────────────────────────────────────────
  # --queue=default tường minh (vốn đã ngầm định) — để ranh giới với
  # infun-queue-admin (queue=admin) bên dưới nhìn là thấy, khớp convention
  # docker-compose.production.yml.
  infun-queue:
    image: infun-app:staging
    restart: unless-stopped
    command: php artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=90 --max-time=3600
    environment:
      <<: *app-env
    depends_on:
      infun-php: { condition: service_started }
      mysql: { condition: service_healthy }
      proxysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [infun-net]

  # ── Queue worker ADMIN (bulkhead — job CMS không chặn job của khách) ─────
  # Mirror docker-compose.production.yml, nhưng BẬT SẴN (replicas=1) thay vì
  # tắt như bên production — staging đang cần test job CMS (export/import/
  # re-gen ảnh) ngay, không phải chờ "job đầu tiên" như quy trình production.
  # timeout 600s: job CMS nặng/dài hơn hẳn queue default (90s) của khách.
  infun-queue-admin:
    image: infun-app:staging
    restart: unless-stopped
    deploy:
      replicas: ${STAGING_QUEUE_ADMIN_REPLICAS:-1}
    command: php artisan queue:work redis --queue=admin --sleep=3 --tries=3 --timeout=600 --max-time=3600
    environment:
      <<: *app-env
    depends_on:
      infun-php: { condition: service_started }
      mysql: { condition: service_healthy }
      proxysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [infun-net]

  # ── Scheduler (schedule:work — CHỈ 1 instance, không scale) ──────────────
  infun-scheduler:
    image: infun-app:staging
    container_name: infun-scheduler-staging
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *app-env
    depends_on:
      infun-php: { condition: service_started }
      mysql: { condition: service_healthy }
      proxysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [infun-net]

  # ── Nginx (public/ nướng sẵn trong image, cấu hình LB) ───────────────────
  infun-web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile.staging
      target: web
    image: ghcr.io/phantien304/infun-web:staging
    container_name: infun-web-staging
    restart: unless-stopped
    ports:
      - "${STAGING_WEB_PORT:-8100}:80"   # 8100 để không đụng web dev (8000)
    depends_on:
      - infun-php
    networks: [infun-net]

  # ── MySQL WRITER cho staging (volume độc lập, không đụng dev/Herd) ────────
  # CHỨA DATA THẬT đã copy từ dev (500k sản phẩm, ~3.4GB) — volume
  # staging_mysql_data KHÔNG BAO GIỜ được xoá/reset khi đổi command này.
  mysql:
    image: mariadb:10.11
    container_name: infun-mysql-staging
    restart: unless-stopped
    ports:
      - "${STAGING_DB_PORT:-3307}:3306"   # 3307 để không đụng MySQL dev (3306)
    environment:
      MARIADB_DATABASE: infun
      MARIADB_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=300
      # ── Replication (master/writer) — xem docker/mysql/replica-init.sh ──
      - --server-id=1
      - --log-bin=mysql-bin
      - --binlog-format=ROW
      - --expire-logs-days=3
      - --gtid-domain-id=1
      - --sync-binlog=0
    volumes:
      - staging_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [infun-net]

  # ── MySQL READ REPLICA 1/2 — tự seed từ writer lần đầu qua replica-init.sh ─
  # Service KEY phải đúng "mysql-replica1"/"mysql-replica2" (không hậu tố) vì
  # docker/proxysql/proxysql.cnf hard-code tên này trong mysql_servers (Docker
  # DNS resolve theo service key, không theo container_name).
  mysql-replica1:
    image: mariadb:10.11
    container_name: infun-mysql-replica1-staging
    restart: unless-stopped
    ports:
      - "${STAGING_DB_REPLICA1_PORT:-3311}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MASTER_HOST: mysql
      MASTER_ROOT_PASSWORD: root
      MASTER_DB: infun
      REPL_USER: repl
      REPL_PASSWORD: repl_secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=300
      - --server-id=2
      - --read-only=1
      - --skip-name-resolve
    volumes:
      - staging_mysql_replica1_data:/var/lib/mysql
      - ${STAGING_HOST_CONFIG_DIR:-.}/docker/mysql/replica-init.sh:/docker-entrypoint-initdb.d/10-replica-init.sh:ro
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 60         # DB thật ~3.4GB — dump+import lần đầu lâu hơn dev
      start_period: 180s
    networks: [infun-net]

  mysql-replica2:
    image: mariadb:10.11
    container_name: infun-mysql-replica2-staging
    restart: unless-stopped
    ports:
      - "${STAGING_DB_REPLICA2_PORT:-3312}:3306"
    environment:
      MARIADB_ROOT_PASSWORD: root
      MASTER_HOST: mysql
      MASTER_ROOT_PASSWORD: root
      MASTER_DB: infun
      REPL_USER: repl
      REPL_PASSWORD: repl_secret
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=512M
      - --innodb-flush-log-at-trx-commit=2
      - --max-connections=300
      - --server-id=3
      - --read-only=1
      - --skip-name-resolve
    volumes:
      - staging_mysql_replica2_data:/var/lib/mysql
      - ${STAGING_HOST_CONFIG_DIR:-.}/docker/mysql/replica-init.sh:/docker-entrypoint-initdb.d/10-replica-init.sh:ro
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 15s
      timeout: 5s
      retries: 60
      start_period: 180s
    networks: [infun-net]

  # ── ProxySQL — route 6033(write)→writer, 6034(read)→2 replica cân tải ────
  # Dùng chung docker/proxysql/proxysql.cnf (không sửa) — file đó hard-code
  # tên service mysql/mysql-replica1/mysql-replica2, đã khớp ở trên.
  proxysql:
    image: proxysql/proxysql:2.6.6
    container_name: infun-proxysql-staging
    restart: unless-stopped
    ports:
      - "${STAGING_PROXYSQL_ADMIN_PORT:-6032}:6032"
      - "${STAGING_PROXYSQL_WRITE_PORT:-6033}:6033"
      - "${STAGING_PROXYSQL_READ_PORT:-6034}:6034"
    volumes:
      - ${STAGING_HOST_CONFIG_DIR:-.}/docker/proxysql/proxysql.cnf:/etc/proxysql.cnf:ro
      - staging_proxysql_data:/var/lib/proxysql
    depends_on:
      mysql: { condition: service_healthy }
      mysql-replica1: { condition: service_healthy }
      mysql-replica2: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "proxysql", "--version"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    networks: [infun-net]

  # ── Redis RIÊNG (session + queue + cache) ────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: infun-redis-staging
    restart: always
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "1gb"
      - --maxmemory-policy
      - "noeviction"
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 20s
    networks: [infun-net]

  # ── Meilisearch RIÊNG (Scout) ────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: infun-meili-staging
    restart: unless-stopped
    ports:
      - "${STAGING_MEILI_PORT:-7701}:7700"   # 7701 để không đụng dev (7700)
    environment:
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - staging_meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "meilisearch --version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [infun-net]

  # ── Mailpit (bắt mail staging, không gửi thật) ───────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: infun-mailpit-staging
    restart: unless-stopped
    ports:
      - "${STAGING_MAIL_UI_PORT:-8026}:8025"   # UI (8026 tránh đụng dev 8025)
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks: [infun-net]

volumes:
  staging_mysql_data:
  staging_mysql_replica1_data:
  staging_mysql_replica2_data:
  staging_proxysql_data:
  staging_redis_data:
  staging_meili_data:
  staging_logs:

networks:
  infun-net:
