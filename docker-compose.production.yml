# ═══════════════════════════════════════════════════════════════════════════
# PRODUCTION (AWS EC2 + Docker Compose) — image BẤT BIẾN kéo từ ghcr (tag
# :production), KHÔNG build, KHÔNG mount code.
#
# Khác staging: DB/Redis DÙNG MANAGED (RDS + ElastiCache Valkey) nên KHÔNG chạy
# container mysql/replica/proxysql/redis/mailpit ở đây. Chỉ còn:
#   infun-php · infun-web · infun-queue · infun-scheduler · meilisearch
#
# Biến ${...} lấy từ file .env đặt CÙNG THƯ MỤC (không commit — chứa secret).
# Xem docs/CI-CD-PRODUCTION.md và .env.production.example.
#
#   docker compose -f docker-compose.production.yml pull
#   docker compose -f docker-compose.production.yml up -d
# ═══════════════════════════════════════════════════════════════════════════

x-app-env: &app-env
  APP_ENV: production
  APP_DEBUG: "false"
  APP_KEY: "${APP_KEY:?Chua set APP_KEY trong .env}"
  APP_URL: "${APP_URL:?Chua set APP_URL trong .env}"
  APP_LOCALE: vi
  APP_LOCALES: vi
  APP_FALLBACK_LOCALE: vi

  # Cho phép xem thử theme khác qua ?theme=... (config/theme.php). Đã audit
  # CachePage.php: `theme` nằm trong neverCacheParams nên request này KHÔNG
  # BAO GIỜ ghi/đọc page cache (bypass), không sinh vô hạn cache key như lo
  # ngại ban đầu — các tầng cache DATA khác (CacheGate/FragmentCache/Meilisearch)
  # không bị ảnh hưởng. Muốn tắt khẩn cấp: set PROD_THEME_ALLOW_QUERY=false
  # trong .env rồi recreate, không cần sửa file này.
  THEME_ALLOW_QUERY: "${PROD_THEME_ALLOW_QUERY:-true}"

  # Full-page cache (Redis, TTL 24h — app/Http/Middleware/CachePage.php).
  # Kill-switch riêng biến này (không đọc setting DB) — tắt khẩn cấp không
  # cần vào CMS. Invalidation qua CacheFlushObserver (saved/deleted/restored)
  # đã gắn cho Product/Category/Manufacturer/Filter/Blog... nên sửa nội dung
  # trong CMS tự flush đúng trang liên quan, không cần đợi hết 24h TTL. DB
  # setting config_redis_cache đã =1 sẵn — chỉ thiếu biến này để middleware
  # thật sự bật (mặc định false).
  PAGE_CACHE: "${PROD_PAGE_CACHE:-true}"

  # CORS + Sanctum stateful cho infuncms (SPA riêng, cms.tienpv.shop, gọi
  # thẳng tuyệt đối tới tienpv.shop/rcms — KHÔNG qua same-origin proxy như
  # staging, vì ở đây có domain thật nên SESSION_DOMAIN=.tienpv.shop share
  # cookie được giữa 2 subdomain, xem deploy/DEPLOY-cms.tienpv.shop.md mục 4
  # của repo infuncms). 3 biến này PHẢI đi cùng nhau — thiếu 1 là CORS chặn
  # hoặc Sanctum không cấp cookie phiên dù CORS pass (xem bảng "Gỡ lỗi nhanh"
  # trong doc trên). Trước đây tài liệu có ghi set trong .env nhưng compose
  # file này chưa từng khai báo pass-through nên set .env cũng vô tác dụng
  # — sự cố 2026-08-11, phát hiện lúc build CMS production lần đầu.
  CORS_ALLOWED_ORIGINS: "${PROD_CORS_ALLOWED_ORIGINS:-https://tienpv.shop,https://cms.tienpv.shop}"
  SANCTUM_STATEFUL_DOMAINS: "${PROD_SANCTUM_STATEFUL_DOMAINS:-tienpv.shop,cms.tienpv.shop}"
  SESSION_DOMAIN: "${PROD_SESSION_DOMAIN:-.tienpv.shop}"

  # ── RDS MySQL ──────────────────────────────────────────────────────────────
  # DB_READ_HOST1/DB_WRITE_HOST KHÔNG set → config/database.php tự fallback về
  # DB_HOST (= RDS). Khi thêm RDS Read Replica, set DB_READ_HOST1 = endpoint replica.
  DB_CONNECTION: mysql
  DB_HOST: "${DB_HOST:?Chua set DB_HOST (RDS endpoint)}"
  DB_PORT: "3306"
  DB_DATABASE: "${DB_DATABASE:-infun}"
  DB_USERNAME: "${DB_USERNAME:?Chua set DB_USERNAME}"
  DB_PASSWORD: "${DB_PASSWORD:?Chua set DB_PASSWORD}"
  # SSL tới RDS (tùy chọn). Bỏ trống = nối thẳng trong VPC (traffic đã cô lập).
  # Muốn bật: để global-bundle.pem trong image/mount rồi set đường dẫn ở .env.
  MYSQL_ATTR_SSL_CA: "${MYSQL_ATTR_SSL_CA:-}"

  # ── ElastiCache Valkey (Redis-compatible) ─────────────────────────────────
  REDIS_CLIENT: phpredis
  REDIS_HOST: "${REDIS_HOST:?Chua set REDIS_HOST (Valkey endpoint)}"
  REDIS_PORT: "6379"
  REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
  CACHE_STORE: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis

  # ── Meilisearch (container nội bộ, không publish port) ────────────────────
  SCOUT_DRIVER: meilisearch
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_KEY: "${MEILISEARCH_KEY:?Chua set MEILISEARCH_KEY}"

  # ── Lưu ảnh: Cloudflare R2 + CDN (giữ như dev/staging) ────────────────────
  IMAGE_DISK_DRIVER: "${IMAGE_DISK_DRIVER:-s3}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:?Chua set AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:?Chua set AWS_SECRET_ACCESS_KEY}"
  AWS_DEFAULT_REGION: "${AWS_DEFAULT_REGION:-auto}"
  AWS_BUCKET: "${AWS_BUCKET:-infun-media}"
  AWS_ENDPOINT: "${AWS_ENDPOINT:?Chua set AWS_ENDPOINT}"
  AWS_URL: "${AWS_URL:-https://cdn.lartisan.vn}"
  AWS_USE_PATH_STYLE_ENDPOINT: "true"

  # ── Throttle PROD thật (KHÔNG nới như staging) ────────────────────────────
  THROTTLE_ADD_TO_CART: "${THROTTLE_ADD_TO_CART:-30}"
  THROTTLE_SAVE_ORDER: "${THROTTLE_SAVE_ORDER:-10}"

  MAIL_MAILER: "${MAIL_MAILER:-log}"
  LOG_CHANNEL: stderr

  # ── Cổng chặn IP (middleware LimitAccess) ─────────────────────────────────
  # ENABLED=false = mở public (mặc định). true + IPS=... = chỉ các IP đó vào.
  LIMIT_ACCESS_ENABLED: "${LIMIT_ACCESS_ENABLED:-false}"
  LIMIT_ACCESS_IPS: "${LIMIT_ACCESS_IPS:-}"

services:
  # ── App PHP-FPM (scale được qua deploy.replicas) ──────────────────────────
  infun-php:
    image: ghcr.io/phantien304/infun-app:production
    restart: unless-stopped
    deploy:
      replicas: ${PROD_PHP_REPLICAS:-2}   # t3.small (2GB): 2 replica; resize máy thì tăng
    environment:
      <<: *app-env
    volumes:
      - prod_logs:/var/www/html/storage/logs
    depends_on:
      meilisearch: { condition: service_healthy }
    networks: [infun-net]

  # ── App PHP-FPM ADMIN (CMS) — BULKHEAD ────────────────────────────────────
  # CÙNG image, CÙNG codebase, khác container + khác pool php-fpm.
  #
  # Vì sao không tách repo CMS: 90 controller CMS sẽ chạm gần hết 151 entity
  # trong app/Models/Entities. Tách code = nhân đôi tầng domain (tồn kho,
  # coupon, voucher) hoặc dựng shared package phải version cùng nhịp — trả
  # đủ giá 2 repo mà gần như không decouple được gì. Thứ THẬT SỰ giảm tải là
  # tách RUNTIME, tức đúng service này. Xem docs/CMS-MODULE-BOUNDARY.md.
  #
  # Deploy riêng được dù chung image:
  #   docker compose -f docker-compose.production.yml up -d --no-deps infun-admin-php
  # → không reload FPM storefront (opcache.validate_timestamps=0 nên mỗi lần
  #   reload là một lần chạm đường nóng).
  infun-admin-php:
    image: ghcr.io/phantien304/infun-app:production
    restart: unless-stopped
    deploy:
      replicas: ${PROD_ADMIN_PHP_REPLICAS:-1}   # 5-10 admin online: 1 là đủ
    environment:
      <<: *app-env
      # Nạp docker/php/www.admin.conf: 6 worker, terminate 300s (thay vì 15s
      # của storefront) — export/import CMS chạy vài phút là bình thường và
      # giờ không giữ chỗ của khách mua hàng nữa.
      FPM_POOL_PROFILE: admin

      # Đẩy read của CMS sang RDS Read Replica. PHẢI set CẢ HAI biến:
      # config/database.php fallback read/write về DB_HOST, nên nếu chỉ đổi
      # read mà quên write thì lệnh ghi của CMS bay thẳng vào replica
      # (read_only) → lỗi lúc lưu sản phẩm. Chưa dựng replica thì để trống,
      # cả hai tự fallback DB_HOST như cũ.
      DB_READ_HOST1: "${DB_ADMIN_READ_HOST:-${DB_HOST}}"
      DB_WRITE_HOST: "${DB_HOST}"
    volumes:
      - prod_logs:/var/www/html/storage/logs
    depends_on:
      meilisearch: { condition: service_healthy }
    networks: [infun-net]

  # ── Nginx (public/ nướng sẵn trong image) ─────────────────────────────────
  infun-web:
    image: ghcr.io/phantien304/infun-web:production
    container_name: infun-web-prod
    restart: unless-stopped
    ports:
      - "${PROD_WEB_PORT:-8100}:80"
    depends_on:
      - infun-php
      # nginx có `resolver` nên tự re-resolve được, nhưng chờ sẵn ở đây thì
      # không ăn 502 trong vài giây đầu sau `up -d`.
      - infun-admin-php
    networks: [infun-net]

  # ── Queue worker (cùng image app) ─────────────────────────────────────────
  infun-queue:
    image: ghcr.io/phantien304/infun-app:production
    restart: unless-stopped
    # --queue=default nói rõ ra thứ vốn đã ngầm định (REDIS_QUEUE=default), để
    # khi thêm queue `admin` bên dưới thì ranh giới nhìn là thấy: worker này
    # CHỈ phục vụ job của khách (mail xác nhận đơn, verify email…).
    command: php artisan queue:work redis --queue=default --sleep=1 --tries=3 --timeout=90 --max-time=3600
    environment:
      <<: *app-env
    depends_on:
      infun-php: { condition: service_started }
      meilisearch: { condition: service_healthy }
    networks: [infun-net]

  # ── Queue worker ADMIN — mặc định TẮT (replicas=0) ────────────────────────
  # Tầng thứ hai của cùng nguyên tắc bulkhead: job do admin sinh ra (re-gen
  # thumbnail, export, import) không được xếp trước email xác nhận đơn của
  # khách. Chung một queue thì một lần `images:migrate-r2` là khách chờ mail
  # hàng chục phút.
  #
  # VÌ SAO replicas=0: hiện CHƯA job nào gọi ->onQueue('admin') (kiểm tra:
  # không file nào trong app/Jobs khai báo $queue), nên bật lên chỉ tốn ~90MB
  # RAM để idle — trên t3.small 2GB đó là RAM lấy của storefront.
  # BẬT khi viết job CMS đầu tiên: đặt PROD_QUEUE_ADMIN_REPLICAS=1 trong .env
  # và dispatch bằng ProcessImageUpload::dispatch(...)->onQueue('admin').
  infun-queue-admin:
    image: ghcr.io/phantien304/infun-app:production
    restart: unless-stopped
    deploy:
      replicas: ${PROD_QUEUE_ADMIN_REPLICAS:-0}
    # timeout 600s: job CMS nặng và dài, khác hẳn queue default (90s).
    command: php artisan queue:work redis --queue=admin --sleep=3 --tries=3 --timeout=600 --max-time=3600
    environment:
      <<: *app-env
    depends_on:
      meilisearch: { condition: service_healthy }
    networks: [infun-net]

  # ── Scheduler (CHỈ 1 instance) ────────────────────────────────────────────
  infun-scheduler:
    image: ghcr.io/phantien304/infun-app:production
    container_name: infun-scheduler-prod
    restart: unless-stopped
    command: php artisan schedule:work
    environment:
      <<: *app-env
    depends_on:
      infun-php: { condition: service_started }
    networks: [infun-net]

  # ── Meilisearch (Scout) — nội bộ, KHÔNG mở port ra host ───────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: infun-meili-prod
    restart: unless-stopped
    environment:
      MEILI_ENV: "${MEILI_ENV:-production}"
      MEILI_MASTER_KEY: "${MEILISEARCH_KEY:?Chua set MEILISEARCH_KEY}"
      MEILI_NO_ANALYTICS: "true"
      # EC2 t3.small = 2GB RAM tổng, KHÔNG chạy DB/Redis ở đây (RDS/ElastiCache
      # managed) nhưng vẫn chia sẻ RAM với 6 container app khác. Không set biến
      # này, Meilisearch mặc định tự cấp ~2/3 RAM hệ thống cho tác vụ index —
      # một mình đã gần bằng RAM còn trống, rủi ro OOM/swap-thrash cả máy lúc
      # `products:scout-import` 500k sản phẩm. Cap tường minh, an toàn hơn.
      MEILI_MAX_INDEXING_MEMORY: "${MEILI_MAX_INDEXING_MEMORY:-512 MB}"
    volumes:
      - prod_meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "meilisearch --version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks: [infun-net]

volumes:
  prod_meili_data:
  prod_logs:

networks:
  infun-net:
