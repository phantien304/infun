# nginx vhost Laravel infun — phiên bản LOAD BALANCE.
# Khác với default.conf:
#   - upstream pool "fpm_pool" resolve qua DNS Docker mỗi 10s
#   - khi `docker compose up --scale infun-php=N`, Docker DNS trả N IP cho
#     tên `infun-php` → nginx round-robin / least_conn tự balance
#   - log thêm $upstream_addr để biết request đi backend nào
#
# Lưu ý: directive `resolver` BẮT BUỘC. Không có resolver, nginx chỉ
# resolve DNS 1 lần lúc start và cache vĩnh viễn → scale thêm replica
# sẽ không nhận được traffic mới.

# 127.0.0.11 là DNS embedded của Docker (mọi container đều dùng IP này).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fpm_pool {
    # `zone` bắt buộc khi dùng `resolve` — nginx cần shared memory để mọi
    # worker process cùng thấy danh sách IP vừa re-resolve. Thiếu dòng này
    # nginx từ chối start hẳn (emerg lúc `nginx -t`), không phải lỗi ngầm.
    zone fpm_pool 64k;

    # least_conn: ưu tiên backend ít connection nhất. Hợp với request
    # PHP có thời gian xử lý không đều (DB query nặng/nhẹ khác nhau).
    # Đổi sang `random two` hoặc bỏ (default round-robin) để so sánh.
    least_conn;

    # Dùng `server` với `resolve` để nginx re-resolve mỗi 10s — cần
    # nginx-plus HOẶC nginx mainline OSS >= 1.27.3 (đã có set_by_lua
    # workaround không cần). Image nginx:1.27-alpine support sẵn.
    server infun-php:9000 resolve max_fails=3 fail_timeout=10s;

    # keepalive connection để giảm overhead bắt tay TCP với FPM.
    keepalive 32;
}

# ── Pool ADMIN (CMS) — BULKHEAD ────────────────────────────────────────────
# Tách hẳn khỏi fpm_pool ở trên. Mục đích không phải "cho nhanh hơn" mà là
# CÁCH LY: request CMS nặng (list 166 bảng có filter, export, upload) không
# còn chiếm được worker php-fpm của storefront. Admin bận hết 6 worker của
# mình thì admin chậm — khách mua hàng không biết gì.
#
# Không least_conn: chỉ 1 replica, và request CMS dài ngắn thất thường nên
# round-robin mặc định là đủ. keepalive nhỏ vì lưu lượng thấp.
upstream fpm_admin {
    zone fpm_admin 64k;
    server infun-admin-php:9000 resolve max_fails=3 fail_timeout=10s;
    keepalive 8;
}

# Custom log format: thêm upstream + response time để phân tích perf.
log_format lb_combined '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'upstream=$upstream_addr';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /var/log/nginx/infun_access.log lb_combined;
    error_log  /var/log/nginx/infun_error.log;

    # ── ADMIN: /vcms (Blade CMS) + /rcms (API cho SPA) → pool riêng ────────
    # ĐẶT TRƯỚC `location /` và `location ~ \.php$`: nginx thử regex location
    # theo THỨ TỰ KHAI BÁO, khớp cái đầu tiên là dừng.
    #
    # Cố ý KHÔNG dùng `try_files ... /index.php?$query_string` ở đây. try_files
    # sinh internal redirect tới /index.php, và /index.php lại khớp
    # `location ~ \.php$` bên dưới → request quay về fpm_pool của storefront,
    # phá sạch bulkhead mà không có dấu hiệu gì (vẫn 200, chỉ là chạy nhầm
    # pool). Nên gọi thẳng fastcgi_pass và tự set SCRIPT_FILENAME.
    #
    # Laravel định tuyến bằng REQUEST_URI (fastcgi_params đã set) nên chạy
    # index.php trực tiếp là đủ.
    location ~ ^/(vcms|rcms)(/|$) {
        fastcgi_pass fpm_admin;
        fastcgi_keep_conn on;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param PATH_INFO       $uri;

        # 300s — khớp request_terminate_timeout của pool admin
        # (docker/php/www.admin.conf). Lệch hai bên thì nginx cắt trước, FPM
        # vẫn chạy tiếp và giữ worker vô ích.
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;

        client_max_body_size 64m;
        access_log /var/log/nginx/infun_admin_access.log lb_combined;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;

        # ===== Điểm khác biệt LB =====
        fastcgi_pass fpm_pool;
        fastcgi_keep_conn on;
        # ==============================

        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    # Healthcheck endpoint cho LB tự test
    location = /__lb_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}

# ═══════════════════════════════════════════════════════════════════════════
# VHOST RIÊNG CHO CMS — cms.infun.co
#
# Khác server block trên ở chỗ: TOÀN BỘ request vào đây đi pool admin, không
# cần match path. Dùng khi muốn CMS có origin riêng (cookie/CORS tách bạch,
# đặt WAF/IP-allowlist ở tầng LB cho đúng một hostname).
#
# TRẠNG THÁI: khai báo sẵn nhưng chưa có tác dụng cho tới khi DNS
# cms.infun.co trỏ về LB production. Hiện `cms.infun.co` mới chỉ tồn tại
# LOCAL (file hosts → Herd → Vite dev, xem infuncms/deploy/SETUP-cms.infun.co.md),
# nên block này inert — thêm vào giờ để lúc cần chỉ phải đổi DNS.
#
# Định tuyến path-based ở server block trên là cơ chế CHÍNH và đã hoạt động
# ngay: dù gọi qua infun.co/rcms hay cms.infun.co/rcms, request đều về
# fpm_admin. Hai đường, cùng một bulkhead.
#
# LƯU Ý khi bật thật: block này phục vụ Laravel (API /rcms + Blade /vcms) từ
# cùng public/. SPA infuncms là build tĩnh deploy riêng — hoặc đưa bundle vào
# public/cms/ rồi thêm location, hoặc cho SPA một hostname khác. Đừng để hai
# thứ tranh nhau cùng một server_name.
# ═══════════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name cms.infun.co;

    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /var/log/nginx/infun_admin_access.log lb_combined;
    error_log  /var/log/nginx/infun_admin_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Mọi PHP trên hostname này → pool admin (khác server block storefront:
    # ở đây không cần phân biệt path vì cả vhost đã là của admin).
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass fpm_admin;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
        fastcgi_send_timeout 300;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /__lb_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
