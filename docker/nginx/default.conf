# nginx vhost cho Laravel infun.
# - Serve static từ /var/www/html/public
# - Forward .php → php-fpm container `infun-php:9000`
# - Tăng client_max_body_size để upload ảnh sản phẩm không bị 413.
#
# `upstream ... resolve` + `resolver`: bắt buộc, nếu không nginx chỉ resolve
# DNS 1 lần lúc worker khởi động rồi cache vĩnh viễn — mỗi lần `infun-php`
# bị recreate (rebuild/restart) là đổi IP nội bộ Docker, nginx (thường sống
# lâu hơn container php) vẫn trỏ IP cũ đã chết → 502 Bad Gateway, phải
# restart tay `infun-web` mới hết. Có resolver, nginx tự re-resolve mỗi
# `valid=10s` nên không cần restart nữa. Cùng cơ chế với default.lb.conf.

# 127.0.0.11 là DNS embedded của Docker (mọi container đều dùng IP này).
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fpm_infun_php {
    zone fpm_infun_php 64k;
    server infun-php:9000 resolve max_fails=3 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    # Vite HMR khi dev: Laravel resources tự load qua @vite, kết nối tới
    # http://localhost:5174 (service infun-vite). Không cần proxy ở nginx
    # vì browser kết nối thẳng tới host port.

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass fpm_infun_php;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 300;
    }

    # Cache asset tĩnh build sẵn (public/build, public/cms, public/data)
    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Chặn truy cập file ẩn
    location ~ /\.(?!well-known) {
        deny all;
    }

    access_log /var/log/nginx/infun_access.log;
    error_log  /var/log/nginx/infun_error.log;
}
