# nginx vhost Laravel infun — FREE TIER POC (1 pool FPM duy nhất).
#
# Khác default.lb.conf: KHÔNG có bulkhead admin/storefront (upstream
# fpm_admin) — chỉ 1 EC2 t3.micro (1GB RAM) không đủ chỗ chạy 2 pool FPM
# riêng. /vcms + /rcms chạy CHUNG upstream fpm_pool với storefront, mất tính
# cách ly (CMS nặng có thể chiếm hết worker của khách) — chấp nhận được cho
# POC vài chục request đồng thời, KHÔNG dùng file này cho production thật.
#
# resolver bắt buộc — xem comment gốc trong default.lb.conf.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fpm_pool {
    zone fpm_pool 64k;
    server infun-php:9000 resolve max_fails=3 fail_timeout=10s;
    keepalive 8;
}

log_format lb_combined '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time" '
                      'upstream=$upstream_addr';

server {
    listen 80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;

    client_max_body_size 64m;

    access_log /var/log/nginx/infun_access.log lb_combined;
    error_log  /var/log/nginx/infun_error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # /vcms + /rcms giờ KHÔNG cần fastcgi_pass riêng (không còn pool admin để
    # tách) — để rơi thẳng xuống location ~ \.php$ bên dưới như mọi route
    # khác. Vẫn giữ timeout dài hơn default (300s thay vì 30s của
    # www.freetier.conf's request_terminate_timeout) qua chính location đó vì
    # export/import CMS có thể chạy lâu hơn PHP-FPM sẽ cắt trước ở tầng đó —
    # nginx timeout ở đây chỉ cần ĐỦ DÀI hơn FPM, không cần khớp chính xác.
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass fpm_pool;
        fastcgi_keep_conn on;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_read_timeout 60;
    }

    location ~* \.(?:jpg|jpeg|png|gif|webp|svg|ico|css|js|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location = /__lb_health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
