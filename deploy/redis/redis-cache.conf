# ─────────────────────────────────────────────────────────────────────────────
# Redis instance CACHE (Laravel REDIS_CACHE_HOST/PORT trỏ vào đây)
# Chạy: redis-server /etc/redis/redis-cache.conf
#
# Nguyên tắc: cache là data VỨT ĐƯỢC. Đầy RAM → evict key ít dùng (LRU),
# app chỉ tốn 1 lần query lại DB. Không persistence — chết thì warm lại.
# ─────────────────────────────────────────────────────────────────────────────
port 6380
bind 127.0.0.1 10.0.0.0        # SỬA: IP private mà app server kết nối tới
protected-mode yes
requirepass CHANGE_ME_STRONG   # SỬA + đồng bộ REDIS_CACHE_PASSWORD nếu tách pass

# Evict LRU toàn bộ keyspace khi đầy
maxmemory 4gb                  # SỬA theo RAM máy — cache_page + query cache ăn nhiều
maxmemory-policy allkeys-lru

# KHÔNG persistence
appendonly no
save ""

tcp-keepalive 300
timeout 0
