# ─────────────────────────────────────────────────────────────────────────────
# Redis instance SESSION + QUEUE (Laravel REDIS_HOST trỏ vào đây)
# Chạy: redis-server /etc/redis/redis-session.conf
#
# Nguyên tắc: KHÔNG BAO GIỜ evict. Session bị evict = user đăng xuất giữa
# chừng, mất giỏ hàng; queue bị evict = mất job (mail đơn hàng, ảnh R2...).
# Đầy RAM → Redis trả lỗi ghi (app thấy ngay) thay vì lặng lẽ mất data.
# ─────────────────────────────────────────────────────────────────────────────
port 6379
bind 127.0.0.1 10.0.0.0        # SỬA: IP private mà app server kết nối tới
protected-mode yes
requirepass CHANGE_ME_STRONG   # SỬA + đồng bộ REDIS_PASSWORD trong .env

# Không evict — điểm khác biệt then chốt với instance cache
maxmemory 2gb                  # SỬA theo RAM máy; chừa đủ cho copy-on-write khi rewrite AOF
maxmemory-policy noeviction

# Persistence: AOF everysec — restart mất tối đa 1 giây ghi
appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 256mb
dir /var/lib/redis-session

# RDB snapshot phụ (backup nguội)
save 900 1
save 300 100

tcp-keepalive 300
timeout 0
