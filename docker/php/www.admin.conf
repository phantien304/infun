; ─────────────────────────────────────────────────────────────────────────────
; php-fpm pool ADMIN (CMS) — dùng cho container `infun-admin-php`.
;
; Nạp bằng cách set env FPM_POOL_PROFILE=admin; entrypoint sẽ copy file này đè
; lên /usr/local/etc/php-fpm.d/zz-www.conf trước khi exec php-fpm.
; Không set env → container chạy pool storefront mặc định (www.pool.conf).
;
; VÌ SAO POOL RIÊNG (không chỉ là "cho vui"):
;   Storefront và CMS có profile tải NGƯỢC NHAU.
;     - storefront: hàng nghìn request ngắn, phải chết nhanh khi kẹt
;       (request_terminate_timeout = 15s) để không dồn hàng đợi.
;     - CMS: vài chục request/phút nhưng nặng và dài (list 166 bảng có filter,
;       export, upload ảnh) — 15s là quá ngắn, admin sẽ gặp 504 liên tục.
;   Chung một pool thì phải chọn một con số sai cho một trong hai bên. Tách pool
;   là cách duy nhất cho cả hai đúng, ĐỒNG THỜI dựng bulkhead: admin có bận hết
;   worker cũng chỉ bận worker của chính nó, không đụng tới slot của khách mua.
;
; SIZE: 5-10 admin online, phần lớn thời gian là think-time (đang gõ form).
; In-flight thực tế 2-4. Đặt 6 để có margin cho lúc 2-3 người cùng bấm export.
;   6 × ~90MB RSS ≈ 540MB. Trên t3.small 2GB, đây là phần bị lấy khỏi
;   storefront — muốn cả hai thoải mái thì resize lên t3.medium.
; ─────────────────────────────────────────────────────────────────────────────
[www]
; static: số worker cố định. Admin tải thấp và đều, không đáng để trả chi phí
; fork của `dynamic`; đổi lại RAM chiếm dụng là hằng số, dễ tính khi chia máy
; với storefront.
pm = static
pm.max_children = 6

; Recycle sớm hơn storefront (1000). Request CMS ngốn bộ nhớ hơn nhiều
; (Excel export, xử lý ảnh, collection lớn) nên leak tích luỹ nhanh hơn.
pm.max_requests = 300

pm.status_path = /fpm-status

; 300s thay vì 15s của storefront. Đây là điểm quan trọng nhất của file này:
; export/import CMS chạy vài phút là bình thường, và vì pool đã tách nên một
; request 300s KHÔNG còn giữ chỗ của khách mua hàng nữa.
; Kèm theo: nginx location /vcms|/rcms đặt fastcgi_read_timeout 300 cho khớp
; (docker/nginx/default.lb.conf) — lệch hai bên thì nginx cắt trước, FPM vẫn
; chạy tiếp và giữ worker.
request_terminate_timeout = 300s

; php.ini trong image đặt max_execution_time=60 (hợp storefront). Nới cho pool
; này — max_execution_time không đếm thời gian I/O, nên nó gác CPU-time còn
; request_terminate_timeout ở trên gác wall-clock.
php_admin_value[max_execution_time] = 300

; CMS upload ảnh gốc / import file lớn.
php_admin_value[upload_max_filesize] = 64M
php_admin_value[post_max_size] = 64M
php_admin_value[memory_limit] = 768M

; Ngưỡng slowlog cao hơn storefront (2s) — ở CMS 2s không phải bất thường,
; log ra chỉ tạo nhiễu. >10s mới đáng đi tìm.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 10s
