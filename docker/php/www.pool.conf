; ─────────────────────────────────────────────────────────────────────────────
; php-fpm pool tuning — STAGING (mount đè qua docker-compose.scale.yml).
; File load SAU www.conf gốc nên chỉ cần override các key pm.*.
;
; CÔNG THỨC SIZE (áp dụng cả prod — xem deploy/php/www.conf):
;   pm.max_children = RAM dành cho FPM ÷ RSS trung bình 1 worker
;   Laravel app này ~60-90MB/worker → server 8GB dành 4GB cho FPM ≈ 50 children
;   Tổng concurrency hệ thống = số app server × max_children
;   Size theo IN-FLIGHT thực (vài nghìn với 30k active có think-time),
;   KHÔNG size theo 30k. Thiếu worker → request xếp hàng ở listen backlog
;   (chậm) chứ không chết; thừa worker → OOM (chết).
; ─────────────────────────────────────────────────────────────────────────────
[www]
; dynamic: co giãn theo tải — hợp staging/máy dev. Prod tải đều dùng static
; (khỏi tốn chi phí fork khi burst).
pm = dynamic
pm.max_children = 60
pm.start_servers = 15
pm.min_spare_servers = 8
pm.max_spare_servers = 25

; Recycle worker sau 1000 request — chống memory leak tích luỹ.
pm.max_requests = 1000

; Endpoint theo dõi busy/idle worker (map trong nginx nếu muốn xem):
;   location = /fpm-status { fastcgi_pass ...; include fastcgi_params; }
pm.status_path = /fpm-status

; Kill request PHP kẹt quá 15s (thay max_execution_time vốn không đếm I/O).
; Hạ từ 60s → 15s: dưới tải, worker kẹt giữ chỗ tới 60s làm hàng đợi dồn ứ
; theo cấp số nhân (quan sát được ở k6 TARGET=600-1200 — ~17-19% request
; timeout ở đúng mốc 60s). 15s vẫn dư margin so với slow query chậm nhất đo
; được (~9s, xem slowlog) nhưng giải phóng worker nhanh hơn nhiều khi kẹt thật.
request_terminate_timeout = 15s

; Log request chậm >2s kèm stacktrace — tìm endpoint nghẽn khi chạy k6.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 2s
