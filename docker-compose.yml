# Stack dev đầy đủ cho infun + infun_cms — chạy hoàn toàn trong Docker, không
# cần XAMPP. Trên Windows mở Docker Desktop rồi chạy ở thư mục này:
#
#   docker compose up -d --build
#   docker compose logs -f infun-php infun-vite infun-cms
#   docker compose down            # giữ volume
#   docker compose down -v         # xoá luôn data MySQLdoc/Redis
#
# Truy cập:
#   Laravel API/web        http://localhost:8000
#   Vite (Laravel assets)  http://localhost:5174   (do @vite trong blade gọi)
#   infun_cms (React SPA)  http://localhost:5173
#   MariaDB                127.0.0.1:3306  (root/root, db = infun)
#   Redis                  127.0.0.1:6379
#   Redis Insight          http://localhost:5540
#
# Lưu ý .env của infun khi chạy Docker:
#   DB_HOST=mysql      (tên service, không phải 127.0.0.1)
#   REDIS_HOST=redis
#
# .env của infun_cms (file infun_cms/.env):
#   VITE_API_BASE_URL=http://localhost:8000/rcms
#   VITE_LARAVEL_ORIGIN=http://localhost:8000

name: infun-stack

services:
  # ──────────────────────────────────────────────────────────────────────
  # PHP-FPM cho Laravel infun
  # ──────────────────────────────────────────────────────────────────────
  infun-php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: infun-php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    environment:
      # Override để app trỏ vào service trong network (ưu tiên hơn .env)
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: infun
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SCOUT_DRIVER: meilisearch
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ""
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks:
      - infun-net

  # ──────────────────────────────────────────────────────────────────────
  # Nginx serve public/ + proxy PHP-FPM
  # ──────────────────────────────────────────────────────────────────────
  infun-web:
    image: nginx:1.27-alpine
    container_name: infun-web
    restart: unless-stopped
    ports:
      # Để Herd giữ port 80 phục vụ infun.test. Docker nginx chỉ là backup/test,
      # truy cập qua localhost:8000 nếu cần so sánh với Herd.
      - "8000:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - infun-php
    networks:
      - infun-net

  # ──────────────────────────────────────────────────────────────────────
  # Vite dev server cho Laravel infun (resources/js, @vite trong blade)
  # ──────────────────────────────────────────────────────────────────────
  # Cùng dùng image PHP-FPM (đã có Node? KHÔNG → tách image Node riêng).
  infun-vite:
    image: node:20-alpine
    container_name: infun-vite
    restart: unless-stopped
    working_dir: /app
    # Vite Laravel chạy nội bộ port 5174 (khác 5173 của infun-cms).
    # Host map 5174:5174 → URL trong public/hot mà Vite ghi
    # (http://localhost:5174) khớp với port host browser fetch được.
    ports:
      - "5174:5174"
    volumes:
      - ./:/app
      - infun_node_modules:/app/node_modules
    command: sh -c "([ -d node_modules ] && [ -n \"$$(ls -A node_modules)\" ] || npm install --no-audit --no-fund) && npm run dev -- --host 0.0.0.0 --port 5174"
    networks:
      - infun-net

  # ──────────────────────────────────────────────────────────────────────
  # infun_cms — React SPA độc lập (port 5173)
  # ──────────────────────────────────────────────────────────────────────
  infun-cms:
    build:
      context: ../infun_cms
      dockerfile: Dockerfile
    container_name: infun-cms
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ../infun_cms:/app
      - cms_node_modules:/app/node_modules
    environment:
      # Cho phép Vite HMR thấy host từ Windows
      CHOKIDAR_USEPOLLING: "true"
      # LAN access: set LAN_HOST khi up nếu cần browser ở máy khác kết nối
      # HMR được. Ví dụ:
      #   $env:LAN_HOST = "192.168.1.100"; docker compose up -d infun-cms
      # Không set → fallback Herd 'cms.infun.test' (mặc định local-only).
      VITE_HMR_HOST: ${LAN_HOST:-}
    networks:
      - infun-net

  # ──────────────────────────────────────────────────────────────────────
  # MariaDB
  # ──────────────────────────────────────────────────────────────────────
  mysql:
    image: mariadb:10.11
    container_name: infun-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MARIADB_DATABASE: infun
      MARIADB_ROOT_PASSWORD: root
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
      - --innodb-log-file-size=256M
      - --innodb-flush-log-at-trx-commit=2
      - --innodb-flush-method=O_DIRECT
      - --max-connections=300
      - --tmp-table-size=64M
      - --max-heap-table-size=64M
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - infun-net

  # ──────────────────────────────────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: infun-redis
    # always thay vì unless-stopped — sau hibernate, WSL2 network corrupt
    # nhiều khi daemon thấy container "stopped" do networking lỗi → always
    # khôi phục được, unless-stopped không.
    restart: always
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --protected-mode
      - "no"
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - "allkeys-lru"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      # Sau hibernate, healthcheck đầu thường timeout — start_period cho
      # 30s khoan chấm fail. Interval 5s để phát hiện sớm.
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 30s
    labels:
      # Marker cho autoheal container nhận biết → restart khi unhealthy.
      autoheal: "true"
    networks:
      - infun-net

  # Watcher restart mọi container có label autoheal=true khi unhealthy.
  # Image willfarrell/autoheal nhẹ ~10MB, mount docker.sock để gọi API.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: infun-autoheal
    restart: always
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: "10"      # check mỗi 10s
      AUTOHEAL_START_PERIOD: "30"  # chờ 30s sau container start
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - infun-net

  redis-insight:
    image: redis/redisinsight:latest
    container_name: infun-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    volumes:
      - redis_insight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - infun-net

  # ──────────────────────────────────────────────────────────────────────
  # Meilisearch — full-text search cho Product (Laravel Scout driver).
  # ──────────────────────────────────────────────────────────────────────
  # Web UI tích hợp sẵn: http://localhost:7700 (cần master key nếu set).
  # Dev: bỏ key cho gọn; prod BẮT BUỘC set MEILI_MASTER_KEY.
  # Index data persist trong volume → seed 500k product chỉ build index 1 lần.
  meilisearch:
    image: getmeili/meilisearch:v1.10
    container_name: infun-meilisearch
    restart: unless-stopped
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development        # development: KHÔNG cần master key
      MEILI_NO_ANALYTICS: "true"
      # MEILI_MASTER_KEY: "change-me-in-prod"   # uncomment cho prod
    volumes:
      - meilisearch_data:/meili_data
    # KHÔNG dùng wget/curl — image meilisearch slim không có cả 2. Healthcheck
    # qua chính binary meilisearch (`--version` trả 0 khi container sống) đủ
    # để depends_on: service_healthy của infun-php không kẹt vĩnh viễn.
    healthcheck:
      test: ["CMD-SHELL", "meilisearch --version >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - infun-net

  # ──────────────────────────────────────────────────────────────────────
  # Mailpit — mail server local để test gửi mail (SMTP catcher + Web UI)
  # UI:   http://localhost:8025
  # SMTP: mailpit:1025 (các container khác gọi qua tên service này)
  # ──────────────────────────────────────────────────────────────────────
  mailpit:
    image: axllent/mailpit:latest
    container_name: infun-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"   # Web UI
      - "1025:1025"   # SMTP
    environment:
      MP_MAX_MESSAGES: "500"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    networks:
      - infun-net

volumes:
  mysql_data:
  redis_data:
  redis_insight_data:
  meilisearch_data:
  infun_node_modules:
  cms_node_modules:

networks:
  infun-net:
    driver: bridge
