; ─────────────────────────────────────────────────────────────────────────────
; OPcache chế độ PROD — mount đè qua docker-compose.scale.yml
; (load sau zz-app.ini trong image nên override được).
;
; validate_timestamps=0: PHP KHÔNG stat file kiểm tra thay đổi mỗi request —
; nhanh nhất, đúng chuẩn prod. ĐÁNH ĐỔI: sửa code phải restart FPM:
;   docker compose restart infun-php
; (Dev thường không dùng file này — chỉ bật khi chạy load test / staging.)
; ─────────────────────────────────────────────────────────────────────────────
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
opcache.jit=tracing
opcache.jit_buffer_size=128M
opcache.enable_file_override=1
